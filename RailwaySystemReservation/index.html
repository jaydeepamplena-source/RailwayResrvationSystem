<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJCC Railways</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left-panel">

        <div class="overlay-content">

            <div class="logo-area">
                <div class="logo">JR</div>
                <h2>JJCC RAILWAYS</h2>
            </div>

            <h1>YOUR JOURNEY,<br>OUR PRIORITY.</h1>

            <p>
                Book tickets, manage reservations, and stay on track with
                real-time schedules.
            </p>

        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="right-panel">

        <!-- TOGGLE -->
        <div class="tabs">
            <button id="signInTab" class="tab active" onclick="showSignIn()">
                SIGN IN
            </button>

            <button id="signUpTab" class="tab" onclick="showSignUp()">
                SIGN UP
            </button>
        </div>


        <!-- SIGN IN -->
        <div id="signInForm" class="form-container">

            <h1>WELCOME !</h1>

            <label>EMAIL ADDRESS</label>
            <input type="email" placeholder="Please enter your Email">

            <label>PASSWORD</label>

            <div class="password-box">
                <input type="password" id="loginPassword" placeholder="Enter password">
                <button onclick="showPassword('loginPassword', this)">
                    SHOW
                </button>
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button class="main-button">
                SIGN IN
            </button>

            <div class="divider">
                <span>Or Continue With</span>
            </div>

            <div class="social-buttons">

                <button class="social google">
                    <span class="google-icon">G</span>
                    Google
                </button>

                <button class="social facebook">
                    <span class="facebook-icon">f</span>
                    Facebook
                </button>

            </div>

        </div>


        <!-- SIGN UP -->
        <div id="signUpForm" class="form-container signup-form">

            <h1>CREATE ACCOUNT</h1>

            <label>USERNAME</label>
            <input type="text" placeholder="Please enter your Username">

            <label>EMAIL ADDRESS</label>
            <input type="email" placeholder="Please enter your Email">

            <label>PASSWORD</label>

            <div class="password-box">
                <input type="password" id="signupPassword" placeholder="Enter password">
                <button onclick="showPassword('signupPassword', this)">
                    SHOW
                </button>
            </div>

            <label>CONFIRM PASSWORD</label>

            <div class="password-box">
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <button onclick="showPassword('confirmPassword', this)">
                    SHOW
                </button>
            </div>

            <button class="main-button">
                CREATE AN ACCOUNT
            </button>

            <div class="divider">
                <span>Or Continue With</span>
            </div>

            <div class="social-buttons">

                <button class="social google">
                    <span class="google-icon">G</span>
                    Google
                </button>

                <button class="social facebook">
                    <span class="facebook-icon">f</span>
                    Facebook
                </button>

            </div>

        </div>

    </div>

</div>

<script>

function showSignIn() {

    document.getElementById("signInForm").style.display = "block";
    document.getElementById("signUpForm").style.display = "none";

    document.getElementById("signInTab").classList.add("active");
    document.getElementById("signUpTab").classList.remove("active");
}


function showSignUp() {

    document.getElementById("signInForm").style.display = "none";
    document.getElementById("signUpForm").style.display = "block";

    document.getElementById("signUpTab").classList.add("active");
    document.getElementById("signInTab").classList.remove("active");
}


function showPassword(id, button) {

    const password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
    } else {
        password.type = "password";
        button.textContent = "SHOW";
    }

}

</script>

</body>
</html>
